[project]
name = "secureagent"
version = "0.1.0"
description = "Static application-security scanner (SecureAgent)"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1", "pydantic>=2"]

[project.scripts]
secureagent = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.reports" = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]  # generated migrations

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # dummy credentials in fixtures

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # local alembic/ dir is migrations, not the package

[tool.pytest.ini_options]
testpaths = ["tests"]
