# Example GitHub Actions workflow for SecureAgent's static scanner.
# Copy to .github/workflows/secureagent.yml in your project and adjust paths.
#
# It fails the build only on NEW high/critical findings: commit a baseline once
# (`secureagent scan . --write-baseline .secureagent-baseline.json`) so existing
# findings do not block, then every PR is gated on newly introduced issues.

name: SecureAgent

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install SecureAgent
        run: pip install git+https://github.com/pranithreddy12/SecureAgent.git#subdirectory=backend

      # SARIF for the GitHub Security tab (code scanning). Does not fail the build.
      - name: Static security scan (SARIF)
        run: secureagent scan . --format sarif --output secureagent.sarif || true

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: secureagent.sarif

      # Gate the build on NEW high/critical findings only (commit the baseline first).
      - name: Fail on new high/critical findings
        run: >
          secureagent scan .
          --baseline .secureagent-baseline.json
          --fail-on high
