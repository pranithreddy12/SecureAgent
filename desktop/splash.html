<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SecureAgent</title>
<style>
  :root {
    --background: #0e0f12;
    --foreground: #e9e4d8;
    --muted: #9b9488;
    --accent: #b6904f;
    --border: #2b2d33;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: Georgia, "Times New Roman", serif;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  main { text-align: center; max-width: 28rem; padding: 0 2rem; }
  h1 { font-size: 1.75rem; font-weight: 500; margin: 0 0 0.25rem; letter-spacing: 0.01em; }
  p.tagline {
    margin: 0 0 2.5rem;
    font-family: system-ui, sans-serif;
    font-size: 0.8rem;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .rule { width: 3rem; height: 1px; background: var(--accent); margin: 0 auto 2.5rem; opacity: 0.6; }
  #status {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    min-height: 2.6em;
    line-height: 1.4;
  }
  .dots::after {
    content: "";
    animation: dots 1.4s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
</style>
</head>
<body>
<main>
  <h1>SecureAgent</h1>
  <p class="tagline">Application Security Auditor</p>
  <div class="rule"></div>
  <p id="status" class="dots">Starting<span></span></p>
</main>
</body>
</html>
