name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: secureagent
          POSTGRES_PASSWORD: secureagent
          POSTGRES_DB: secureagent_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U secureagent -d secureagent_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Native libraries for PDF rendering (exercises the PDF test)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
        working-directory: .
      - name: Install pinned runtime deps, then dev tools
        run: pip install -r requirements.lock && pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck   # generates Next's route types first, then tsc
      - run: npm test            # Vitest + Testing Library
      - run: npm run build

  self-scan:
    name: SecureAgent scans itself
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./backend
      - name: Demo works from the installed package
        run: secureagent demo --no-color > /dev/null
      # Accepted findings live in .secureagent-baseline.json (see docs/PROJECT_CLOSEOUT.md);
      # the gate fails only on NEW high/critical findings. Test fixtures: .secureagentignore.
      - name: Scan this repository
        run: secureagent scan . --baseline .secureagent-baseline.json --fail-on high --format sarif --output secureagent.sarif
      - name: Upload SARIF as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secureagent-sarif
          path: secureagent.sarif

  e2e:
    name: End-to-end (Playwright + Docker Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Seed the workspace the audit UI will analyse
        run: |
          mkdir -p workspace
          cp -r backend/app/demo/demo_fixtures/vulnerable_shop workspace/shop
      - name: Create a throwaway .env (CI-only secrets)
        run: |
          cp .env.example .env
          sed -i "s|^SECRET_KEY=.*|SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')|" .env
          sed -i "s|change-me|ci-only-password|g" .env
      - name: Start the stack (postgres, backend, frontend)
        run: docker compose up --build -d backend frontend
      - name: Wait for the app
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:3000/api/health && exit 0
            sleep 3
          done
          docker compose logs --tail=100
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and the Playwright browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v
